name: R8 Linux acceptance

on:
  push:
    branches: [FOLIO-4]
    paths:
      - ".github/workflows/r8-acceptance.yml"
      - "scripts/r8_fetch_models.py"
      - "scripts/r8_monitor_rss.py"
      - "src-tauri/Cargo.lock"
      - "src-tauri/resources/model-manifest.json"
      - "src-tauri/crates/folio-core/Cargo.toml"
      - "src-tauri/crates/folio-core/src/**"
      - "src-tauri/crates/folio-core/tests/real_acceptance.rs"
      - "fixtures/documents/**"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/r8-acceptance.yml"
      - "scripts/r8_fetch_models.py"
      - "scripts/r8_monitor_rss.py"
      - "src-tauri/Cargo.lock"
      - "src-tauri/resources/model-manifest.json"
      - "src-tauri/crates/folio-core/Cargo.toml"
      - "src-tauri/crates/folio-core/src/**"
      - "src-tauri/crates/folio-core/tests/real_acceptance.rs"
      - "fixtures/documents/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Real-model acceptance (Ubuntu CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Initialize evidence directory
        shell: bash
        run: |
          set -euo pipefail
          echo "FOLIO_R8_OUTPUT_DIR=$RUNNER_TEMP/folio-r8/online" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/folio-r8/online" "$RUNNER_TEMP/folio-r8/offline"
          cat > "$RUNNER_TEMP/folio-r8/README.md" <<'EOF'
          Folio Issue #4 R8 real-model acceptance evidence.

          This job uses only the pinned public artifacts from
          src-tauri/resources/model-manifest.json. It is one bounded Ubuntu CPU
          job. The harness phases are ignored Rust tests run sequentially with
          --ignored --test-threads=1, and each phase writes JSON evidence before
          its assertions. Summary factual correctness is recorded as
          factualReview=notReviewed; this job does not make a subjective TJ
          correctness decision. This is not an #8 benchmark, a desktop GUI
          verification, or an 8 GB RAM claim.
          EOF

      - name: Compile R8 harness without executing it
        id: compile
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          compile_json="$RUNNER_TEMP/folio-r8/compile.json"
          compile_stderr="$RUNNER_TEMP/folio-r8/compile.stderr"
          cargo test \
            --manifest-path src-tauri/crates/folio-core/Cargo.toml \
            --test real_acceptance \
            --no-run \
            --message-format=json \
            >"$compile_json" 2>"$compile_stderr"
          python3 -I - "$compile_json" "$GITHUB_ENV" <<'PY'
          import json
          import os
          import sys

          compile_path, env_path = sys.argv[1:]
          binary = None
          with open(compile_path, encoding="utf-8") as stream:
              for line in stream:
                  message = json.loads(line)
                  if (
                      message.get("reason") == "compiler-artifact"
                      and message.get("target", {}).get("name") == "real_acceptance"
                      and message.get("executable")
                  ):
                      binary = message["executable"]
          if not binary or not os.path.isfile(binary) or not os.access(binary, os.X_OK):
              raise SystemExit("cargo did not produce an executable R8 harness")
          with open(env_path, "a", encoding="utf-8") as stream:
              stream.write(f"FOLIO_R8_TEST_BINARY={binary}\n")
          PY

      - name: Read pinned artifact identities
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - src-tauri/resources/model-manifest.json "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          manifest_path, output_path = sys.argv[1:]
          manifest = json.load(open(manifest_path, encoding="utf-8"))

          def file_entry(collection, item_id, path):
              entries = manifest[collection]
              item = next(item for item in entries if item["id"] == item_id)
              return next(file for file in item["files"] if file["path"] == path)

          entries = {
              "e5_sha": file_entry(
                  "models", "multilingual-e5-small-int8", "onnx/model_quantized.onnx"
              )["sha256"],
              "tokenizer_sha": file_entry(
                  "models", "multilingual-e5-small-int8", "tokenizer.json"
              )["sha256"],
              "qwen_sha": file_entry(
                  "models", "qwen3-0.6b-q4-k-m", "Qwen3-0.6B-Q4_K_M.gguf"
              )["sha256"],
              "runtime_sha": file_entry(
                  "runtimes", "llama-b11524-ubuntu-x64", "llama-b11524-bin-ubuntu-x64.tar.gz"
              )["sha256"],
          }
          with open(output_path, "a", encoding="utf-8") as stream:
              for name, value in entries.items():
                  stream.write(f"{name}={value}\n")
          PY

      - name: Restore or cache pinned public artifacts
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/folio-r8/models
          key: r8-models-${{ steps.manifest.outputs.e5_sha }}-${{ steps.manifest.outputs.tokenizer_sha }}-${{ steps.manifest.outputs.qwen_sha }}-${{ steps.manifest.outputs.runtime_sha }}

      - name: Fetch and verify pinned public artifacts
        id: models
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          python3 -I scripts/r8_fetch_models.py \
            --manifest src-tauri/resources/model-manifest.json \
            --output-dir "$RUNNER_TEMP/folio-r8/models" \
            --metadata "$RUNNER_TEMP/folio-r8/model-metadata.json"
          python3 -I - "$RUNNER_TEMP/folio-r8/model-metadata.json" "$GITHUB_ENV" <<'PY'
          import json
          import sys

          metadata_path, env_path = sys.argv[1:]
          metadata = json.load(open(metadata_path, encoding="utf-8"))
          artifacts = {item["name"]: item for item in metadata["artifacts"]}
          required = ("e5_model", "e5_tokenizer", "qwen_model", "llama_runtime")
          missing = [name for name in required if name not in artifacts]
          if missing:
              raise SystemExit(f"metadata is missing artifacts: {missing}")
          values = {
              "FOLIO_E5_MODEL": artifacts["e5_model"]["path"],
              "FOLIO_E5_TOKENIZER": artifacts["e5_tokenizer"]["path"],
              "FOLIO_QWEN_MODEL": artifacts["qwen_model"]["path"],
              "FOLIO_RUNTIME_ARCHIVE": artifacts["llama_runtime"]["path"],
              "FOLIO_E5_MODEL_SHA256": artifacts["e5_model"]["sha256"],
              "FOLIO_E5_TOKENIZER_SHA256": artifacts["e5_tokenizer"]["sha256"],
              "FOLIO_QWEN_MODEL_SHA256": artifacts["qwen_model"]["sha256"],
              "FOLIO_MODEL_METADATA": metadata_path,
          }
          with open(env_path, "a", encoding="utf-8") as stream:
              for name, value in values.items():
                  stream.write(f"{name}={value}\n")
          PY

      - name: Extract verified llama.cpp runtime and locate ONNX Runtime
        id: runtime
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="$RUNNER_TEMP/folio-r8/runtime"
          mkdir -p "$runtime_dir"
          tar --extract --gzip --file "$FOLIO_RUNTIME_ARCHIVE" --directory "$runtime_dir" --no-same-owner
          llama_server="$(find "$runtime_dir" -type f -name llama-server -print -quit)"
          test -n "$llama_server"
          test -x "$llama_server"
          printf 'FOLIO_LLAMA_SERVER=%s\n' "$llama_server" >> "$GITHUB_ENV"
          "$llama_server" --version >"$RUNNER_TEMP/folio-r8/llama-server-version.txt" 2>&1 || true
          ort_library="$(find "$GITHUB_WORKSPACE/target" \( -type f -o -type l \) -name 'libonnxruntime.so*' -print -quit 2>/dev/null || true)"
          if [[ -z "$ort_library" ]]; then
            echo "ready=static" >> "$GITHUB_OUTPUT"
            echo "FOLIO_ORT_LIBRARY_DIR=" >> "$GITHUB_ENV"
            echo "FOLIO_ORT_LINKAGE=static" >> "$GITHUB_ENV"
            echo "ONNX Runtime linkage is static; no separate libonnxruntime.so needs to be mounted." > "$RUNNER_TEMP/folio-r8/ort-linkage.txt"
          else
            ort_dir="$(dirname "$ort_library")"
            printf 'FOLIO_ORT_LIBRARY_DIR=%s\n' "$ort_dir" >> "$GITHUB_ENV"
            echo "FOLIO_ORT_LINKAGE=dynamic" >> "$GITHUB_ENV"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
          (LD_LIBRARY_PATH="$runtime_dir:${FOLIO_ORT_LIBRARY_DIR:-}" ldd "$FOLIO_R8_TEST_BINARY" || true) > "$RUNNER_TEMP/folio-r8/host-test-ldd.txt" 2>&1
          (LD_LIBRARY_PATH="$runtime_dir:${FOLIO_ORT_LIBRARY_DIR:-}" ldd "$llama_server" || true) > "$RUNNER_TEMP/folio-r8/host-llama-ldd.txt" 2>&1

      - name: Record runner and model environment
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          metadata_path="${FOLIO_MODEL_METADATA:-}"
          python3 -I - "$RUNNER_TEMP/folio-r8/environment.json" "$metadata_path" <<'PY'
          import json
          import os
          import platform
          import subprocess
          import sys

          output_path, metadata_path = sys.argv[1:]

          def first_line(path):
              try:
                  with open(path, encoding="utf-8") as stream:
                      return stream.readline().strip()
              except OSError as error:
                  return f"unavailable: {error}"

          def cpu_model():
              try:
                  with open("/proc/cpuinfo", encoding="utf-8") as stream:
                      for line in stream:
                          if line.startswith("model name"):
                              return line.split(":", 1)[1].strip()
                  return "unavailable: model name was not reported"
              except (OSError, IndexError) as error:
                  return f"unavailable: {error}"

          def command(*args):
              try:
                  return subprocess.check_output(args, text=True).strip()
              except (OSError, subprocess.CalledProcessError) as error:
                  return f"unavailable: {error}"

          models = {"status": "unavailable; setup did not complete"}
          if metadata_path:
              try:
                  with open(metadata_path, encoding="utf-8") as stream:
                      models = json.load(stream)
              except OSError as error:
                  models = {"status": f"unavailable: {error}"}
          payload = {
              "runId": os.environ.get("GITHUB_RUN_ID"),
              "commit": os.environ.get("GITHUB_SHA"),
              "workflow": os.environ.get("GITHUB_WORKFLOW"),
              "runner": {
                  "os": platform.platform(),
                  "kernel": platform.release(),
                  "cpuModel": cpu_model(),
                  "logicalCpus": os.cpu_count(),
                  "memTotal": first_line("/proc/meminfo"),
              },
              "rustc": command("rustc", "-Vv"),
              "onnxRuntime": {
                  "crate": "ort 2.0.0-rc.13",
              "linkage": os.environ.get("FOLIO_ORT_LINKAGE", "unknown"),
                  "apiInfo": "printed by the harness after provider initialization; see phase logs",
                  "libraryDirectory": os.environ.get("FOLIO_ORT_LIBRARY_DIR"),
              },
              "models": models,
              "offlineMethod": "Docker ubuntu:24.04 with --network none when Docker and shared libraries are available",
          }
          with open(output_path, "w", encoding="utf-8") as stream:
              json.dump(payload, stream, indent=2)
              stream.write("\n")
          PY

      - name: Run online real-model acceptance phases
        id: online
        timeout-minutes: 15
        shell: bash
        run: |
          set +e
          "$FOLIO_R8_TEST_BINARY" --ignored --test-threads=1 --nocapture >"$RUNNER_TEMP/folio-r8/online.log" 2>&1 &
          test_pid=$!
          python3 -I scripts/r8_monitor_rss.py "$test_pid" "$RUNNER_TEMP/folio-r8/online-rss.json" &
          monitor_pid=$!
          wait "$test_pid"
          test_status=$?
          wait "$monitor_pid"
          monitor_status=$?
          cat "$RUNNER_TEMP/folio-r8/online.log"
          if [[ "$monitor_status" -ne 0 ]]; then
            echo "R8 RSS observer exited with status $monitor_status" >&2
          fi
          exit "$test_status"

      - name: Run Docker network-isolation acceptance phases
        id: offline
        if: always() && steps.runtime.outcome == 'success'
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          offline_dir="$RUNNER_TEMP/folio-r8/offline"
          status_file="$offline_dir/offline-status.json"

          write_status() {
            python3 -I - "$status_file" "$1" "$2" "$3" "$4" "$offline_dir/network-bridge.log" "$offline_dir/network-none.log" <<'PY'
          import json
          import sys

          output_path, status, reason, bridge_code, none_code, bridge_log, none_log = sys.argv[1:]

          def read_log(path):
              try:
                  with open(path, encoding="utf-8") as stream:
                      return stream.read()
              except OSError:
                  return "not run"

          with open(output_path, "w", encoding="utf-8") as stream:
              json.dump(
                  {
                      "status": status,
                      "reason": reason,
                      "probe": {
                          "method": "bash /dev/tcp",
                          "endpoint": "huggingface.co:443",
                          "bridge": {"exitCode": int(bridge_code), "output": read_log(bridge_log)},
                          "networkNone": {"exitCode": int(none_code), "output": read_log(none_log)},
                      },
                  },
                  stream,
                  indent=2,
              )
              stream.write("\n")
          PY
          }

          bridge_status=-1
          none_status=-1
          runtime_ready="${{ steps.runtime.outputs.ready }}"
          if [[ "$runtime_ready" != "true" && "$runtime_ready" != "static" ]]; then
            write_status "notVerified" "compiled ONNX Runtime linkage was unavailable" "$bridge_status" "$none_status"
            exit 1
          fi
          if ! command -v docker >/dev/null 2>&1 || ! docker info >"$offline_dir/docker-info.txt" 2>&1; then
            write_status "notVerified" "Docker is unavailable on this runner" "$bridge_status" "$none_status"
            exit 1
          fi
          if ! docker pull ubuntu:24.04 >"$offline_dir/docker-pull.log" 2>&1; then
            write_status "notVerified" "ubuntu:24.04 could not be pulled; offline execution was not attempted" "$bridge_status" "$none_status"
            exit 1
          fi

          set +e
          docker run --rm --network bridge ubuntu:24.04 bash -ceu '
            if exec 3<>/dev/tcp/huggingface.co/443; then
              echo R8_NETWORK_REACHABLE
              exec 3>&-
            else
              echo R8_NETWORK_UNREACHABLE
            fi
          ' >"$offline_dir/network-bridge.log" 2>&1
          bridge_status=$?
          set -e
          if ! grep -q R8_NETWORK_REACHABLE "$offline_dir/network-bridge.log"; then
            write_status "notVerified" "network bridge canary could not establish a real TCP connection" "$bridge_status" "$none_status"
            exit 1
          fi

          set +e
          docker run --rm --network none ubuntu:24.04 bash -ceu '
            if exec 3<>/dev/tcp/huggingface.co/443; then
              echo R8_NETWORK_REACHABLE
              exec 3>&-
            else
              echo R8_NETWORK_BLOCKED
            fi
          ' >"$offline_dir/network-none.log" 2>&1
          canary_status=$?
          set -e
          none_status=$canary_status
          if grep -q R8_NETWORK_REACHABLE "$offline_dir/network-none.log"; then
            write_status "notVerified" "network canary reached huggingface.co:443 despite --network none" "$bridge_status" "$none_status"
            exit 1
          fi
          if ! grep -q R8_NETWORK_BLOCKED "$offline_dir/network-none.log"; then
            write_status "notVerified" "network canary did not produce a connectivity result (docker exit $canary_status)" "$bridge_status" "$none_status"
            exit 1
          fi

          # The bare ubuntu:24.04 image lacks the OpenMP runtime that the pinned
          # llama.cpp build links against. Build the offline image while the
          # bridge network is still allowed; the acceptance phases below then
          # run with --network none.
          offline_image="folio-r8-offline:local"
          if ! docker build --network host --tag "$offline_image" - >"$offline_dir/offline-image-build.log" 2>&1 <<'DOCKERFILE'
          FROM ubuntu:24.04
          RUN apt-get update \
            && apt-get install --yes --no-install-recommends libgomp1 \
            && rm -rf /var/lib/apt/lists/*
          DOCKERFILE
          then
            write_status "notVerified" "the offline container image could not be built" "$bridge_status" "$none_status"
            exit 1
          fi
          docker image inspect "$offline_image" --format '{{.Id}}' >"$offline_dir/offline-image-id.txt"

          runtime_dir="$RUNNER_TEMP/folio-r8/runtime"
          if ! docker run --rm --network none \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            --volume "$runtime_dir:$runtime_dir:ro" \
            --env "LD_LIBRARY_PATH=$FOLIO_ORT_LIBRARY_DIR:$runtime_dir" \
            "$offline_image" bash -ceu '
              for binary in "$@"; do
                echo "--- ldd $binary ---"
                dependencies="$(ldd "$binary" 2>&1)" || {
                  echo "$dependencies"
                  exit 2
                }
                echo "$dependencies"
                if grep -q "not found" <<<"$dependencies"; then
                  exit 2
                fi
              done
            ' bash "$FOLIO_R8_TEST_BINARY" "$FOLIO_LLAMA_SERVER" >"$offline_dir/container-ldd.txt" 2>&1; then
            write_status "notVerified" "container shared-library preflight reported a missing dependency" "$bridge_status" "$none_status"
            exit 1
          fi
          if ! docker run --rm --network none \
            --volume "$runtime_dir:$runtime_dir:ro" \
            --env "LD_LIBRARY_PATH=$FOLIO_ORT_LIBRARY_DIR:$runtime_dir" \
            "$offline_image" bash -ceu '"$1" --version' bash "$FOLIO_LLAMA_SERVER" >"$offline_dir/llama-server-version.txt" 2>&1; then
            write_status "notVerified" "llama-server --version failed inside the offline container" "$bridge_status" "$none_status"
            exit 1
          fi
          write_status "verified" "Docker bridge connectivity succeeded and network-none blocked the real TCP probe" "$bridge_status" "$none_status"

          offline_output="$offline_dir/results"
          mkdir -p "$offline_output"
          set -o pipefail
          docker run --rm --network none \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            --volume "$RUNNER_TEMP/folio-r8/models:$RUNNER_TEMP/folio-r8/models:ro" \
            --volume "$RUNNER_TEMP/folio-r8/runtime:$RUNNER_TEMP/folio-r8/runtime:ro" \
            --volume "$offline_output:$offline_output:rw" \
            --workdir "$GITHUB_WORKSPACE" \
            --env "FOLIO_E5_MODEL=$FOLIO_E5_MODEL" \
            --env "FOLIO_E5_TOKENIZER=$FOLIO_E5_TOKENIZER" \
            --env "FOLIO_QWEN_MODEL=$FOLIO_QWEN_MODEL" \
            --env "FOLIO_LLAMA_SERVER=$FOLIO_LLAMA_SERVER" \
            --env "FOLIO_E5_MODEL_SHA256=$FOLIO_E5_MODEL_SHA256" \
            --env "FOLIO_E5_TOKENIZER_SHA256=$FOLIO_E5_TOKENIZER_SHA256" \
            --env "FOLIO_QWEN_MODEL_SHA256=$FOLIO_QWEN_MODEL_SHA256" \
            --env "FOLIO_R8_OUTPUT_DIR=$offline_output" \
            --env "LD_LIBRARY_PATH=$FOLIO_ORT_LIBRARY_DIR:$RUNNER_TEMP/folio-r8/runtime" \
            "$offline_image" \
            "$FOLIO_R8_TEST_BINARY" --ignored --test-threads=1 --nocapture \
            2>&1 | tee "$offline_dir/offline.log"

      - name: Upload R8 evidence and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: folio-4-r8-evidence-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/folio-r8/**
            !${{ runner.temp }}/folio-r8/models/**
            !${{ runner.temp }}/folio-r8/runtime/**

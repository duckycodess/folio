[package]
name = "folio-core"
version = "0.1.0"
description = "Testable local inference and model-lab core for Folio"
edition = "2021"
rust-version = "1.88"

[lib]
name = "folio_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

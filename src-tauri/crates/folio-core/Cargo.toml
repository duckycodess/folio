[package]
name = "folio-core"
version = "0.1.0"
description = "Testable local inference and model-lab core for Folio"
edition = "2021"
rust-version = "1.88"

[lib]
name = "folio_core"
path = "src/lib.rs"

[dependencies]
flate2 = "1"
hex = "0.4"
ort = "=2.0.0-rc.13"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"

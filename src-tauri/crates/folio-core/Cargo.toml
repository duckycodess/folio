[package]
name = "folio-core"
version = "0.1.0"
description = "Testable local inference and model-lab core for Folio"
edition = "2021"
rust-version = "1.88"

[lib]
name = "folio_core"
path = "src/lib.rs"

[dependencies]
flate2 = "1"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

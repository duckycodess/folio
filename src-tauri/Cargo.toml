[package]
name = "folio"
version = "0.1.0"
description = "Search, Organize, Summarize — a private local file workspace"
edition = "2021"

[lib]
name = "folio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
unicode-normalization = "0.1"
walkdir = "2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"

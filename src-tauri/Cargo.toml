[package]
name = "folio"
version = "0.1.0"
description = "Search, Organize, Summarize — a private local file workspace"
edition = "2021"

[workspace]
members = ["crates/folio-core"]
resolver = "2"

[lib]
name = "folio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
folio-core = { path = "crates/folio-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
unicode-normalization = "0.1"
walkdir = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
hex = "0.4.3"
serde_json = "1.0.151"
lopdf = { version = "0.45.0", default-features = false }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
